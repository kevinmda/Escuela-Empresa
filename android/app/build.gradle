plugins {
    id 'com.android.application'
}

// Firma de la release: las contraseñas viven en keystore.properties (gitignored,
// junto con el .jks), igual que application.properties con las credenciales del
// backend. Sin ese archivo (clon nuevo, CI sin secretos) la release simplemente
// sale sin firmar -- el build no se rompe, solo esa APK no se puede instalar
// todavía. Ver keystore.properties.example para la plantilla.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hayKeystore = keystorePropertiesFile.exists()
if (hayKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.escuelaempresa.gestorpasantes'
    compileSdk 35

    defaultConfig {
        applicationId "com.escuelaempresa.gestorpasantes"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (hayKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hayKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.fragment:fragment:1.8.4'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // Cliente HTTP recomendado por la consigna
    implementation 'com.android.volley:volley:1.2.1'

    // Guardar el JWT cifrado en disco, no en SharedPreferences planas
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Skeleton de carga (shimmer) en el dashboard y las listas
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
}
