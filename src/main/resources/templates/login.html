<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Iniciar sesión')}"></head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>

    <div class="auth-split">

        <main class="auth-panel">
            <div class="auth-card">
                <img th:replace="~{fragments/auth :: logoTarjeta}">

                <h1 class="auth-titulo">Ingresá tu contraseña</h1>

                <p th:if="${param.error}" class="mensaje-error" role="alert">
                    Email o contraseña incorrectos.
                </p>
                <p th:if="${param.bloqueado}" class="mensaje-error" role="alert">
                    Tu cuenta fue bloqueada temporalmente por varios intentos fallidos. Probá de nuevo en 15 minutos.
                </p>
                <p th:if="${param.errorCorreo}" class="mensaje-error" role="alert">
                    No pudimos enviarte el correo. Intentá iniciar sesión de nuevo en unos minutos.
                </p>

                <form th:action="@{/login}" method="post" class="auth-form">
                    <div>
                        <label for="username">Email</label>
                        <input id="username" type="text" name="username" th:value="${email}"
                               autocomplete="username" readonly>
                    </div>
                    <div>
                        <label for="password">Contraseña</label>
                        <div class="campo-password">
                            <input id="password" type="password" name="password"
                                   autocomplete="current-password" required autofocus>
                            <button type="button" class="toggle-password" data-target="password"
                                    aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
                        </div>
                    </div>
                    <div class="auth-checkbox">
                        <label>
                            <input type="checkbox" name="remember-me"> Recordarme más tarde
                        </label>
                    </div>
                    <button type="submit" class="btn-primary">Ingresar</button>
                </form>

                <div class="auth-links">
                    <a th:href="@{/olvide-contrasena(email=${email})}">¿Olvidaste tu contraseña?</a>
                    <a th:href="@{/login(volver=true, email=${email})}">← Usar otro email</a>
                </div>
            </div>

            <th:block th:replace="~{fragments/auth :: pieLegal}"></th:block>
        </main>
    </div>
</body>
</html>
