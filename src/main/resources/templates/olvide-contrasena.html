<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Olvidé mi contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h2>Recuperar contraseña</h2>

    <p>Ingresá tu email y te vamos a mandar un código para restablecer tu contraseña.</p>

    <p th:if="${error}" style="color: red;" th:text="${error}"></p>

    <form th:action="@{/olvide-contrasena}" method="post">
        <div>
            <label>Email:</label>
            <input type="email" name="email" th:value="${email}" required autofocus>
        </div>
        <button type="submit">Enviar código</button>
    </form>

    <p><a th:href="@{/login(email=${email})}">← Volver al login</a></p>
</body>
</html>
