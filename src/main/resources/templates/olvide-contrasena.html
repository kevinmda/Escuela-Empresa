<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Recuperar contraseña')}"></head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>

    <div class="auth-split">

        <main class="auth-panel">
            <div class="auth-card">
                <img th:replace="~{fragments/auth :: logoTarjeta}">

                <h1 class="auth-titulo">Recuperá tu contraseña</h1>

                <p class="auth-nota">
                    Te vamos a mandar un código de 6 dígitos a <strong th:text="${email}"></strong>
                    para que puedas elegir una contraseña nueva. El código vale por 5 minutos.
                </p>

                <p th:if="${error}" class="mensaje-error" role="alert" th:text="${error}"></p>

                <form th:action="@{/olvide-contrasena}" method="post" class="auth-form">
                    <button type="submit" class="btn-primary">Enviar código</button>
                </form>

                <div class="auth-links">
                    <a th:href="@{/login(email=${email})}">← Volver al login</a>
                </div>
            </div>

            <th:block th:replace="~{fragments/auth :: pieLegal}"></th:block>
        </main>
    </div>
</body>
</html>
