<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/img/ctnLogoDef.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTN Pasantias al</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <header>
        <div class="h-titulo">
            <img class="h-titulo-logo" th:src="@{/img/ctnLogoDef.png}" alt="CTN Logo">
            <h1>Colegio Técnico Nacional de Asunción</h1>
        </div>
        <div class="h-links">
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
            <button type="button" id="theme-toggle" class="theme-toggle">Modo oscuro</button>
            <a th:href="@{/pdf/Escuela%20Empresa%20-%20Alumnos.pdf}" class="h-links-help" target="_blank" rel="noopener">Ayuda</a>
            <form th:action="@{/logout}" method="post" style="display: inline;" onsubmit="return confirm('¿Estás seguro que quieres cerrar sesión?');">
                <button type="submit" class="h-links-logout">Cerrar sesión</button>
            </form>
        </div>
    </header>
    <nav>
        <a th:href="@{/alumno/imprimir}" class="nav-links">Imprimir</a>
        <a th:href="@{/alumno/planilla}" class="nav-links">Planilla Semanal</a>
        <a th:href="@{/alumno/subir}" class="nav-links activo">Subir</a>
    </nav>
    <main>
        <h2>Subir documento</h2>
        <p class="subtitulo-pagina">Subí acá la planilla que llenaste a mano, convertida a PDF.</p>

        <p th:if="${error}" class="mensaje-error" th:text="${error}"></p>
        <p th:if="${exito}" class="mensaje-exito" th:text="${exito}"></p>

        <div class="panel upload-card">
            <form th:action="@{/alumno/subir}" method="post" enctype="multipart/form-data">
                <label for="tipo-documento">Tipo de documento *</label>
                <select id="tipo-documento" name="tipoDocumento" required>
                    <option value="">-- Seleccioná un tipo --</option>
                    <option th:each="tipo : ${tiposDocumento}" 
                            th:value="${tipo.name()}"
                            th:text="${tipo.descripcion + ' (' + (limitadorDynamic = __#{__'subidos_' + tipo.name__()} ?: 0__) + '/' + __#{__'limite_' + tipo.name__()} ?: 1__)}"
                            th:disabled="${limitadorDynamic >= (__#{__'limite_' + tipo.name__()} ?: 1)}"></option>
                </select>
                <div id="estado-limite" class="info-limite" style="margin-top: 0.5rem; font-size: 0.85rem; color: var(--ink-soft);"></div>

                <label for="archivo-input" class="dropzone" id="dropzone">
                    <span class="dropzone-titulo" id="dropzone-titulo">Hacé click o arrastrá tu PDF acá</span>
                    <span class="dropzone-subtitulo">Solo archivos PDF</span>
                </label>
                <input type="file" id="archivo-input" name="archivo" accept="application/pdf" required class="dropzone-input">
                <button type="submit" class="btn-primary" id="btn-subir">Subir documento</button>
            </form>
        </div>

        <h3 class="subseccion-titulo">Mis documentos subidos</h3>

        <table th:if="${not #lists.isEmpty(documentos)}">
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Nombre</th>
                    <th>Fecha</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="doc : ${documentos}">
                    <td th:text="${doc.tipoDocumento != null ? doc.tipoDocumento.descripcion : 'Sin especificar'}"></td>
                    <td th:text="${doc.nombreArchivo}"></td>
                    <td th:text="${#temporals.format(doc.fechaSubida, 'dd/MM/yyyy HH:mm')}"></td>
                    <td><a th:href="@{/alumno/subir/{id}/ver(id=${doc.idDs})}" target="_blank">Ver</a></td>
                    <td>
                        <form th:action="@{/alumno/subir/{id}/eliminar(id=${doc.idDs})}" method="post" style="display: inline;" onsubmit="return confirm('¿Estás seguro que querés eliminar este documento? Esta acción no se puede deshacer.');">
                            <button type="submit" class="icono-eliminar" aria-label="Eliminar documento">Eliminar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(documentos)}" class="mensaje-vacio">Todavía no subiste ningún documento.</p>
    </main>

    <script>
        const dropzone = document.getElementById('dropzone');
        const inputArchivo = document.getElementById('archivo-input');
        const dropzoneTitulo = document.getElementById('dropzone-titulo');

        function actualizarNombreArchivo() {
            if (inputArchivo.files && inputArchivo.files.length > 0) {
                dropzoneTitulo.textContent = inputArchivo.files[0].name;
                dropzone.classList.add('dropzone-con-archivo');
            } else {
                dropzoneTitulo.textContent = 'Hacé click o arrastrá tu PDF acá';
                dropzone.classList.remove('dropzone-con-archivo');
            }
        }

        inputArchivo.addEventListener('change', actualizarNombreArchivo);

        ['dragover', 'dragleave', 'drop'].forEach(evento => {
            dropzone.addEventListener(evento, (e) => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        dropzone.addEventListener('dragover', () => dropzone.classList.add('dropzone-activo'));
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dropzone-activo'));
        dropzone.addEventListener('drop', (e) => {
            dropzone.classList.remove('dropzone-activo');
            if (e.dataTransfer.files.length > 0) {
                inputArchivo.files = e.dataTransfer.files;
                actualizarNombreArchivo();
            }
        });

        // GESTIÓN DE LÍMITES DE DOCUMENTOS
        const selectTipo = document.getElementById('tipo-documento');
        const estadoLimite = document.getElementById('estado-limite');
        const btnSubir = document.getElementById('btn-subir');

        // Datos de límites desde el servidor (via Thymeleaf)
        const limites = {
            'CONTRATO': { limite: [[${limite_CONTRATO ?: 1}]], subidos: [[${subidos_CONTRATO ?: 0}]] },
            'PLANTILLA_SEMANAL': { limite: [[${limite_PLANTILLA_SEMANAL ?: 6}]], subidos: [[${subidos_PLANTILLA_SEMANAL ?: 0}]] },
            'AUTORIZACION': { limite: [[${limite_AUTORIZACION ?: 1}]], subidos: [[${subidos_AUTORIZACION ?: 0}]] },
            'FICHA_FINAL_ALUMNO': { limite: [[${limite_FICHA_FINAL_ALUMNO ?: 1}]], subidos: [[${subidos_FICHA_FINAL_ALUMNO ?: 0}]] },
            'FICHA_FINAL_EVALUATIVA': { limite: [[${limite_FICHA_FINAL_EVALUATIVA ?: 1}]], subidos: [[${subidos_FICHA_FINAL_EVALUATIVA ?: 0}]] }
        };

        function actualizarEstadoLimite() {
            const tipoSeleccionado = selectTipo.value;
            
            if (!tipoSeleccionado) {
                estadoLimite.textContent = '';
                btnSubir.disabled = false;
                return;
            }

            const datos = limites[tipoSeleccionado];
            if (datos) {
                const { limite, subidos } = datos;
                const restante = limite - subidos;

                if (subidos >= limite) {
                    estadoLimite.innerHTML = '❌ Ya alcanzaste el máximo de ' + limite + ' documentos de este tipo.';
                    estadoLimite.style.color = '#e74c3c';
                    btnSubir.disabled = true;
                } else if (restante <= 1 && limite > 1) {
                    estadoLimite.innerHTML = '⚠️ Has subido ' + subidos + ' de ' + limite + ' (' + restante + ' restante)';
                    estadoLimite.style.color = '#f39c12';
                    btnSubir.disabled = false;
                } else {
                    estadoLimite.innerHTML = '✓ Has subido ' + subidos + ' de ' + limite + ' (' + restante + ' restantes)';
                    estadoLimite.style.color = '#27ae60';
                    btnSubir.disabled = false;
                }
            }
        }

        selectTipo.addEventListener('change', actualizarEstadoLimite);
    </script>
</body>
</html>
