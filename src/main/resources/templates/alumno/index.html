<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTN Pasantias al</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <header>
        <div class="h-titulo">
            <img class="h-titulo-logo" th:src="@{/img/CtnLogo.png}" alt="CTN Logo">
            <h1>Colegio Técnico Nacional de Asunción</h1>
        </div>
        <div class="h-links">
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
            <button type="button" id="theme-toggle" class="theme-toggle">Modo oscuro</button>
            <a th:href="@{/pdf/Escuela%20Empresa%20-%20Alumnos.pdf}" class="h-links-help" target="_blank" rel="noopener">Ayuda</a>
            <form th:action="@{/logout}" method="post" style="display: inline;" onsubmit="return confirm('¿Estás seguro que quieres cerrar sesión?');">
                <button type="submit" class="h-links-logout">Cerrar sesión</button>
            </form>
        </div>
    </header>
    <nav>
        <a th:href="@{/alumno/imprimir}" class="nav-links">Imprimir</a>
        <a th:href="@{/alumno/planilla}" class="nav-links">Planilla Semanal</a>
        <a th:href="@{/alumno/subir}" class="nav-links">Subir</a>
    </nav>
    <main>
        <section id="inicio-section-saludo">
            <h1 th:text="|Bienvenido, ${alumno.nombres.trim().split(' ')[0]}|">Bienvenido, Alumno</h1>
        </section>
        <section id="inicio-section-info">
            <div id="inicio-info">
                <div id="info-titulo"><h2>Información</h2></div>
                <div class="info"><span th:text="|Nombres: ${alumno.nombres}|"></span><span th:text="|Apellidos: ${alumno.apellidos}|"></span></div>
                <p th:text="|CI: ${alumno.ci}|"></p>
                <p th:text="|Sexo: ${alumno.sexo}|"></p>
                <p th:text="|Telefono: ${alumno.telefono}|"></p>
                <p th:text="|Email: ${alumno.email}|"></p>
                <div class="info"><span th:text="|Curso: ${alumno.curso}|"></span><span th:text="|Sección: ${alumno.seccion}|"></span></div>
                <p th:text="${alumno.supervisor != null
                                ? 'Supervisor asignado: ' + alumno.supervisor.nombres + ' ' + alumno.supervisor.apellidos
                                : 'Supervisor asignado: aún no asignado'}"></p>
            </div>
        </section>
    </main>
</body>
</html>
