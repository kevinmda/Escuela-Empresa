<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <header>
        <div class="h-titulo">
            <img class="h-titulo-logo" th:src="@{/img/CtnLogo.png}" alt="CTN Logo">
            <h1>Colegio Técnico Nacional de Asunción</h1>
        </div>
        <div class="h-links">
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
            <button type="button" id="theme-toggle" class="theme-toggle">Modo oscuro</button>
            <form th:action="@{/logout}" method="post" style="display: inline;" onsubmit="return confirm('¿Estás seguro que quieres cerrar sesión?');">
                <button type="submit" class="h-links-logout">Cerrar sesión</button>
            </form>
        </div>
    </header>
    <main class="auth-main">
        <div class="panel auth-card">
            <h2 class="auth-titulo">Cambiar Contraseña</h2>

            <p th:if="${param.error}" class="mensaje-error">
                La Contraseña Actual es Incorrecta
            </p>
            <p th:if="${param.errorContrasena}" class="mensaje-error">
                La nueva contraseña debe tener al menos 6 caracteres.
            </p>
            <p th:if="${param.exito}" class="mensaje-exito">
                Contraseña Actualizada correctamente
            </p>

            <form th:action="@{cambiar-contrasena}" method="post" class="auth-form"> <!--th:action="@{/cambiarCon} es la manera de Thymeleaf de armar URLs de manera segura-->
                <div>                                       <!--@{...} es sintaxis de URL expression, con esto Thymeleaf lo que hace es ajustar automaticamente la ruta completa-->
                    <label>Contraseña actual:</label>
                    <input type="password" name="actual" required>
                </div>
                <div>
                    <label>Contraseña nueva:</label>
                    <input type="password" name="nueva" required>
                </div>
                <button type="submit" class="btn-primary">Cambiar</button>
            </form>
        </div>
    </main>
</body>
</html>
