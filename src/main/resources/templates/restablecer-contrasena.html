<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/img/CtnLogo.png}">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>
    <h2>Restablecer contraseña</h2>

    <p>Estás restableciendo la contraseña de <strong th:text="${email}"></strong>. Ingresá el código que te llegó por correo y elegí una nueva contraseña.</p>

    <p th:if="${error}" style="color: red;" th:text="${error}"></p>

    <form th:action="@{/restablecer-contrasena}" method="post">
        <div>
            <label>Código:</label>
            <input type="text" name="codigo" maxlength="6" required autofocus>
        </div>
        <div>
            <label>Nueva contraseña:</label>
            <input type="password" name="nuevaContrasena" required>
        </div>
        <div>
            <label>Confirmar contraseña:</label>
            <input type="password" name="confirmarContrasena" required>
        </div>
        <button type="submit">Restablecer</button>
    </form>
</body>
</html>
