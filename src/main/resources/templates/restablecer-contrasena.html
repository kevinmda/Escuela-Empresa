<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Restablecer contraseña')}"></head>
<body>
    <div class="auth-split auth-split--login">

        <main class="auth-panel">
            <div class="auth-card">
                <img th:replace="~{fragments/auth :: logoTarjeta}">

                <h1 class="auth-titulo">Elegí tu nueva contraseña</h1>

                <p class="auth-nota">
                    Ingresá el código de 6 dígitos que te llegó a <strong th:text="${email}"></strong>
                    y elegí una contraseña nueva.
                </p>

                <p th:if="${error}" class="mensaje-error" role="alert" th:text="${error}"></p>

                <form th:action="@{/restablecer-contrasena}" method="post" class="auth-form">
                    <div>
                        <label for="codigo">Código de verificación</label>
                        <input id="codigo" class="input-codigo" type="text" name="codigo" inputmode="numeric"
                               autocomplete="one-time-code" maxlength="6" required autofocus>
                    </div>
                    <div>
                        <label for="nuevaContrasena">Contraseña nueva</label>
                        <div class="campo-password">
                            <input id="nuevaContrasena" type="password" name="nuevaContrasena"
                                   autocomplete="new-password" minlength="6" required>
                            <button type="button" class="toggle-password" data-target="nuevaContrasena"
                                    aria-label="Mostrar contraseña" aria-pressed="false">
                                <svg class="ico-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="ico-ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                        <span class="campo-ayuda">Al menos 6 caracteres.</span>
                    </div>
                    <div>
                        <label for="confirmarContrasena">Confirmar contraseña nueva</label>
                        <div class="campo-password">
                            <input id="confirmarContrasena" type="password" name="confirmarContrasena"
                                   autocomplete="new-password" minlength="6" required
                                   data-confirma="nuevaContrasena">
                            <button type="button" class="toggle-password" data-target="confirmarContrasena"
                                    aria-label="Mostrar contraseña" aria-pressed="false">
                                <svg class="ico-ojo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="ico-ojo-tachado" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Guardar contraseña</button>
                </form>

                <div class="auth-links">
                    <a th:href="@{/olvide-contrasena}">← Pedir un código nuevo</a>
                </div>
            </div>

            <th:block th:replace="~{fragments/auth :: pieLegal}"></th:block>
        </main>
    </div>
</body>
</html>
