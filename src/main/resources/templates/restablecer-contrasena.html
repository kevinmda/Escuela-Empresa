<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <h2>Restablecer contraseña</h2>

    <p>Ingresá el código que te llegó por correo y elegí una nueva contraseña.</p>

    <p th:if="${error}" style="color: red;" th:text="${error}"></p>

    <form th:action="@{/restablecer-contrasena}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <div>
            <label>Código:</label>
            <input type="text" name="codigo" maxlength="6" required autofocus>
        </div>
        <div>
            <label>Nueva contraseña:</label>
            <input type="password" name="nuevaContrasena" required>
        </div>
        <div>
            <label>Confirmar contraseña:</label>
            <input type="password" name="confirmarContrasena" required>
        </div>
        <button type="submit">Restablecer</button>
    </form>
</body>
</html>
