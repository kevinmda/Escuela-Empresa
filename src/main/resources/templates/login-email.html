<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Iniciar sesión')}"></head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>

    <div class="auth-split">

        <main class="auth-panel">
            <div class="auth-card">
                <img th:replace="~{fragments/auth :: logoTarjeta}">

                <h1 class="auth-titulo">Ingresar</h1>

                <p th:if="${param.logout}" class="mensaje-exito">
                    Sesión cerrada correctamente.
                </p>
                <p th:if="${param.activado}" class="mensaje-exito mensaje-exito--hito">
                    Cuenta activada correctamente. Ya podés iniciar sesión.
                </p>
                <p th:if="${param.restablecida}" class="mensaje-exito mensaje-exito--hito">
                    Contraseña restablecida correctamente. Ya podés iniciar sesión.
                </p>

                <form th:action="@{/login-check}" method="post" class="auth-form">
                    <div>
                        <label for="email">Email</label>
                        <input id="email" type="email" name="email" th:value="${email}"
                               autocomplete="username" required autofocus>
                    </div>
                    <button type="submit" class="btn-primary">Continuar</button>
                </form>

                <div class="auth-links">
                    <a th:href="@{/terminos-y-condiciones}">Términos y condiciones</a>
                </div>
            </div>

            <th:block th:replace="~{fragments/auth :: pieLegal}"></th:block>
        </main>
    </div>
</body>
</html>
