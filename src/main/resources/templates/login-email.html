<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/img/ctnLogoDef.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <header>
        <div class="h-titulo">
            <img class="h-titulo-logo" th:src="@{/img/ctnLogoDef.png}" alt="CTN Logo">
            <h1>Colegio Técnico Nacional de Asunción</h1>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle">Modo oscuro</button>
    </header>

    <main class="auth-main">
        <div class="panel auth-card">
            <p class="eyebrow">Acceso al sistema</p>
            <h2 class="auth-titulo">Iniciar sesión</h2>

    <p th:if="${param.logout}" class="mensaje-exito">
        Sesión cerrada correctamente.
    </p>
    <p th:if="${param.activado}" class="mensaje-exito">
        Cuenta activada correctamente. Ya podés iniciar sesión.
    </p>
    <p th:if="${param.restablecida}" class="mensaje-exito">
        Contraseña restablecida correctamente. Ya podés iniciar sesión.
    </p>

    <form th:action="@{/login-check}" method="post" class="auth-form">
        <div>
            <label for="email">Email:</label>
            <input id="email" type="email" name="email" th:value="${email}" required autofocus>
        </div>
        <button type="submit" class="btn-primary">Continuar</button>
    </form>

        </div>
    </main>
</body>
</html>
