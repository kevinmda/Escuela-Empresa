<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/img/ctnLogoDef.png}">
    <title>Verificar código</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>
    <h2>Verificá tu cuenta</h2>

    <p>Te enviamos un código de activación a tu correo. Ingresalo para poder activar la cuenta.</p>

    <p th:if="${error}" style="color: red;" th:text="${error}"></p>

    <form th:action="@{/verificar-codigo}" method="post">
        <input type="hidden" name="email" th:value="${email}">
        <div>
            <label>Código:</label>
            <input type="text" name="codigo" maxlength="6" required autofocus>
        </div>
        <button type="submit">Verificar</button>
    </form>
</body>
</html>
