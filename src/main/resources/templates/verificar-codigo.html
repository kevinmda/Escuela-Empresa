<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Verificar código')}"></head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>

    <div class="auth-split">

        <main class="auth-panel">
            <div class="auth-card">
                <img th:replace="~{fragments/auth :: logoTarjeta}">

                <h1 class="auth-titulo">Verificá tu cuenta</h1>

                <p class="auth-nota">
                    Te enviamos un código de 6 dígitos a <strong th:text="${email}"></strong>.
                    Ingresalo para activar tu cuenta.
                </p>

                <p th:if="${error}" class="mensaje-error" role="alert" th:text="${error}"></p>

                <form th:action="@{/verificar-codigo}" method="post" class="auth-form">
                    <div>
                        <label for="codigo">Código de verificación</label>
                        <input id="codigo" class="input-codigo" type="text" name="codigo" inputmode="numeric"
                               autocomplete="one-time-code" maxlength="6" required autofocus>
                    </div>
                    <button type="submit" class="btn-primary">Verificar</button>
                </form>

                <div class="auth-links">
                    <a th:href="@{/login(email=${email})}">← Volver al login</a>
                </div>
            </div>

            <th:block th:replace="~{fragments/auth :: pieLegal}"></th:block>
        </main>
    </div>
</body>
</html>
