<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/img/ctnLogoDef.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTN Pasantias ad</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <header>
        <div class="h-titulo">
            <img class="h-titulo-logo" th:src="@{/img/ctnLogoDef.png}" alt="CTN Logo">
            <h1>Colegio Técnico Nacional de Asunción</h1>
        </div>
        <div class="h-links">
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
            <button type="button" id="theme-toggle" class="theme-toggle">Modo oscuro</button>
            <a th:href="@{/pdf/Escuela%20Empresa%20-%20Administradores.pdf}" class="h-links-help" target="_blank" rel="noopener">Ayuda</a>
            <form th:action="@{/logout}" method="post" style="display: inline;" onsubmit="return confirm('¿Estás seguro que quieres cerrar sesión?');">
                <button type="submit" class="h-links-logout">Cerrar sesión</button>
            </form>
        </div>
    </header>
    <nav>
        <a th:href="@{/admin/alumnos}" class="nav-links">Alumnos</a>
        <a th:href="@{/admin/reportes}" class="nav-links">Reportes</a>
    </nav>
    <main>
        <section class="saludo">
            <div class="avatar-circulo" th:text="${#strings.substring(admin.nombres.trim(), 0, 1)}">A</div>
            <div>
                <p class="eyebrow">Panel administrativo</p>
                <h1 th:text="|Bienvenido, ${admin.nombres.trim().split(' ')[0]}!|">Bienvenido!</h1>
            </div>
        </section>

        <div class="panel bienvenida">
            <p class="bienvenida-texto">Elegí <strong>Alumnos</strong> para gestionar y descargar la documentación por especialidad, curso y sección, o <strong>Reportes</strong> para revisar el cumplimiento semanal de las planillas.</p>
        </div>
    </main>
</body>
</html>
