<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <!-- Fija data-theme antes de que el navegador pinte nada: theme.js carga con
         defer y corre recien despues del primer render, asi que sin esto la
         pagina arranca en claro (el :root por defecto) y salta a oscuro apenas
         theme.js llega -- ese salto es el parpadeo al cambiar de pagina. -->
    <script>
        (function () {
            var tema = localStorage.getItem('theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = tema;
        })();
    </script>

    <link rel="icon" type="image/png" th:href="@{/img/ctnLogoDef.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opiniones | CTN Pasantías</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>
    <script th:src="@{/js/cookie-consent.js}" defer></script>

</head>
<body>
    <a href="#main-content" class="skip-link">Saltar al contenido</a>
    <th:block th:replace="~{fragments/chrome :: chrome(${chrome}, ${paginaActual}, true)}"></th:block>

    <main id="main-content">
        <div class="registro-cabecera">
            <h2>Opiniones</h2>
        </div>

        <p th:if="${exito}" class="mensaje-exito" th:text="${exito}"></p>
        <p th:if="${error}" class="mensaje-error" th:text="${error}"></p>

        <section class="registro-seccion" aria-labelledby="titulo-opiniones">
            <h3 id="titulo-opiniones">Lo que opinan los alumnos de su empresa</h3>

            <!-- Cada tarjeta lleva su propio data-esp: a diferencia de Supervisores/Empresas
                 (una sola especialidad fija por pantalla), acá el administrativo ve alumnos
                 de TODAS las especialidades mezclados en una sola lista, así que el color no
                 puede fijarse una vez arriba del todo -- cada opinión tiñe la suya. -->
            <div class="opi-lista">
                <article class="opi-tarjeta panel" th:each="opi : ${opiniones}"
                          th:attr="data-esp=${opi.alumno.especialidad != null ? opi.alumno.especialidad.idEsp : ''}">
                    <div class="opi-tarjeta-cabecera">
                        <div class="opi-tarjeta-quien">
                            <p class="opi-tarjeta-alumno"
                               th:text="${opi.alumno.nombres + ' ' + opi.alumno.apellidos}"></p>
                            <p class="opi-tarjeta-meta">
                                <span th:text="${opi.empresa != null ? opi.empresa.nombre : 'Empresa ya no asignada'}"></span>
                                <span aria-hidden="true" th:if="${opi.alumno.especialidad != null}"> · </span>
                                <span th:if="${opi.alumno.especialidad != null}"
                                      th:text="${opi.alumno.especialidad.nombre}"></span>
                            </p>
                        </div>

                        <div class="opi-tarjeta-calificacion">
                            <span class="estrellas-valor" th:attr="aria-label=${opi.calificacion} + ' de 5 estrellas'">
                                <span th:each="n : ${#numbers.sequence(1, 5)}"
                                      th:class="${n <= opi.calificacion} ? 'estrella-llena' : 'estrella-vacia'"
                                      aria-hidden="true">★</span>
                            </span>
                            <span class="opi-tarjeta-fecha"
                                  th:text="${#temporals.format(opi.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                    </div>

                    <p class="opi-tarjeta-texto" th:text="${opi.comentario}"></p>

                    <form th:action="@{'/admin/opiniones/' + ${opi.idOpi} + '/eliminar'}" method="post"
                          class="opi-tarjeta-acciones"
                          data-confirmar
                          th:attr="data-confirmar-titulo='¿Eliminar la opinión de ' + ${opi.alumno.nombres} + ' ' + ${opi.alumno.apellidos} + '?'"
                          data-confirmar-mensaje="Esta acción no se puede deshacer."
                          data-confirmar-texto="Eliminar">
                        <button type="submit" class="btn-danger icono-eliminar">Eliminar</button>
                    </form>
                </article>
            </div>

            <p th:if="${opiniones.isEmpty()}" class="mensaje-vacio">
                Todavía no hay opiniones cargadas.
            </p>
        </section>
    </main>
</body>
</html>
