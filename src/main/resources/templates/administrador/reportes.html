<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTN Pasantias ad</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>
<body>
    <header>
        <div class="h-titulo">
            <img class="h-titulo-logo" th:src="@{/img/CtnLogo.png}" alt="CTN Logo">
            <h1>Colegio Técnico Nacional de Asunción</h1>
        </div>
        <div class="h-links">
            <a th:href="@{/home}">Inicio</a>
            <a th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
            <form th:action="@{/logout}" method="post" style="display: inline;" onsubmit="return confirm('¿Estás seguro que quieres cerrar sesión?');">
                <button type="submit" class="h-links-logout">Cerrar sesión</button>
            </form>
        </div>
    </header>
    <nav>
        <a th:href="@{/admin/alumnos}" th:classappend="${paginaActual == 'alumnos'} ? ' activo'" class="nav-links">Alumnos</a>
        <a th:href="@{/admin/reportes}" th:classappend="${paginaActual == 'reportes'} ? ' activo'" class="nav-links">Reportes</a>
        <a th:unless="${esAdministrativo}" th:href="@{/admin/supervisores}" class="nav-links">Supervisores</a>
        <a th:unless="${esAdministrativo}" th:href="@{/admin/empresas}" class="nav-links">Empresas</a>
    </nav>

    <main>
        <h2>Reporte de Cumplimiento Semanal</h2>

        <div id="busqueda-container" class="toolbar">
            <input type="text" id="input-busqueda" placeholder="Buscar por nombre, apellido o CI...">
            <button id="btn-buscar" type="button" class="btn-primary">Buscar</button>
            <button id="btn-limpiar-busqueda" type="button" class="btn-secondary oculto">Limpiar</button>
        </div>

        <div id="filtro-container" class="toolbar panel">

            <!-- Si es administrativo, elige la especialidad. Si es coordinador, ya viene fija. -->
            <div th:if="${esAdministrativo}">
                <label for="select-especialidad">Especialidad</label>
                <select id="select-especialidad">
                    <option value="">-- Elegí una especialidad --</option>
                    <option th:each="esp : ${especialidades}"
                            th:value="${esp.idEsp}"
                            th:text="${esp.nombre}"></option>
                </select>
            </div>

            <div th:unless="${esAdministrativo}">
                <label>Especialidad</label>
                <span class="valor-fijo" th:text="${especialidadFija.nombre}"></span>
                <input type="hidden" id="idEspFijo" th:value="${especialidadFija.idEsp}">
            </div>

            <div>
                <label for="select-curso">Curso</label>
                <select id="select-curso" disabled>
                    <option value="">-- Elegí un curso --</option>
                </select>
            </div>

            <div>
                <label for="select-seccion">Sección</label>
                <select id="select-seccion" disabled>
                    <option value="">-- Elegí una sección --</option>
                </select>
            </div>
        </div>

        <div id="semana-container" class="oculto semana-nav">
            <button id="btn-semana-anterior" type="button" class="btn-secondary">&laquo; Semana anterior</button>
            <span id="semana-label" class="semana-label"></span>
            <button id="btn-semana-siguiente" type="button" class="btn-secondary">Semana siguiente &raquo;</button>
        </div>

        <table id="tabla-cumplimiento" class="oculto">
            <thead>
                <tr>
                    <th>Nombres</th>
                    <th>Apellidos</th>
                    <th>CI</th>
                    <th>Entregó esta semana</th>
                </tr>
            </thead>
            <tbody id="tabla-cumplimiento-body"></tbody>
        </table>

        <p id="mensaje-vacio" class="oculto mensaje-vacio">No hay alumnos que coincidan con ese filtro.</p>
    </main>

    <script th:inline="javascript">
        const esAdministrativo = /*[[${esAdministrativo}]]*/ false;

        const selectEspecialidad = document.getElementById('select-especialidad');
        const idEspFijoInput = document.getElementById('idEspFijo');
        const selectCurso = document.getElementById('select-curso');
        const selectSeccion = document.getElementById('select-seccion');
        const semanaContainer = document.getElementById('semana-container');
        const semanaLabel = document.getElementById('semana-label');
        const btnSemanaAnterior = document.getElementById('btn-semana-anterior');
        const btnSemanaSiguiente = document.getElementById('btn-semana-siguiente');
        const tabla = document.getElementById('tabla-cumplimiento');
        const tablaBody = document.getElementById('tabla-cumplimiento-body');
        const mensajeVacio = document.getElementById('mensaje-vacio');
        const inputBusqueda = document.getElementById('input-busqueda');
        const btnBuscar = document.getElementById('btn-buscar');
        const btnLimpiarBusqueda = document.getElementById('btn-limpiar-busqueda');
        const filtroContainer = document.getElementById('filtro-container');

        let offsetSemana = 0; // 0 = semana actual, -1 = anterior, +1 = siguiente
        let modoBusqueda = false; // false = usando el filtro en cascada, true = usando la barra de búsqueda

        function idEspSeleccionado() {
            return esAdministrativo ? selectEspecialidad.value : idEspFijoInput.value;
        }

        function resetSelect(select, placeholder) {
            select.innerHTML = `<option value="">${placeholder}</option>`;
            select.disabled = true;
        }

        function cargarCursos() {
            resetSelect(selectCurso, '-- Elegí un curso --');
            resetSelect(selectSeccion, '-- Elegí una sección --');
            ocultarTabla();

            const idEsp = idEspSeleccionado();
            if (!idEsp) return;

            fetch(`/admin/api/cursos?idEsp=${idEsp}`)
                .then(res => res.json())
                .then(cursos => {
                    cursos.forEach(curso => {
                        const opt = document.createElement('option');
                        opt.value = curso;
                        opt.textContent = curso;
                        selectCurso.appendChild(opt);
                    });
                    selectCurso.disabled = false;
                });
        }

        function cargarSecciones() {
            resetSelect(selectSeccion, '-- Elegí una sección --');
            ocultarTabla();

            const idEsp = idEspSeleccionado();
            const curso = selectCurso.value;
            if (!idEsp || !curso) return;

            fetch(`/admin/api/secciones?idEsp=${idEsp}&curso=${encodeURIComponent(curso)}`)
                .then(res => res.json())
                .then(secciones => {
                    secciones.forEach(seccion => {
                        const opt = document.createElement('option');
                        opt.value = seccion;
                        opt.textContent = seccion;
                        selectSeccion.appendChild(opt);
                    });
                    selectSeccion.disabled = false;
                });
        }

        function cargarCumplimiento() {
            const idEsp = idEspSeleccionado();
            const curso = selectCurso.value;
            const seccion = selectSeccion.value;
            if (!idEsp || !curso || !seccion) {
                ocultarTabla();
                return;
            }

            fetch(`/admin/api/cumplimiento?idEsp=${idEsp}&curso=${encodeURIComponent(curso)}&seccion=${encodeURIComponent(seccion)}&offset=${offsetSemana}`)
                .then(res => res.json())
                .then(renderizarCumplimiento);
        }

        function buscarCumplimiento() {
            const texto = inputBusqueda.value.trim();
            if (!texto) return;

            fetch(`/admin/api/buscar-cumplimiento?texto=${encodeURIComponent(texto)}&offset=${offsetSemana}`)
                .then(res => res.json())
                .then(renderizarCumplimiento);
        }

        function renderizarCumplimiento(data) {
            semanaContainer.style.display = 'flex';
            semanaLabel.textContent = `Semana del ${data.semanaDesde} al ${data.semanaHasta}`;

            if (data.alumnos.length === 0) {
                tabla.style.display = 'none';
                mensajeVacio.textContent = modoBusqueda
                    ? 'No se encontró ningún alumno con ese criterio.'
                    : 'No hay alumnos que coincidan con ese filtro.';
                mensajeVacio.style.display = 'block';
                return;
            }

            mensajeVacio.style.display = 'none';
            tablaBody.innerHTML = '';
            data.alumnos.forEach(a => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>${a.nombres ?? ''}</td>
                    <td>${a.apellidos ?? ''}</td>
                    <td>${a.ci ?? ''}</td>
                    <td>
                        <span class="badge ${a.entrego ? 'badge-success' : 'badge-danger'}">${a.entrego ? 'Sí' : 'No'}</span>
                    </td>
                `;
                tablaBody.appendChild(fila);
            });
            tabla.style.display = 'table';
        }

        function ocultarTabla() {
            tabla.style.display = 'none';
            tablaBody.innerHTML = '';
            mensajeVacio.style.display = 'none';
            semanaContainer.style.display = 'none';
        }

        btnSemanaAnterior.addEventListener('click', () => {
            offsetSemana--;
            modoBusqueda ? buscarCumplimiento() : cargarCumplimiento();
        });

        btnSemanaSiguiente.addEventListener('click', () => {
            offsetSemana++;
            modoBusqueda ? buscarCumplimiento() : cargarCumplimiento();
        });

        if (esAdministrativo) {
            selectEspecialidad.addEventListener('change', cargarCursos);
        } else {
            // El coordinador ya tiene especialidad fija: cargamos los cursos apenas entra a la página
            cargarCursos();
        }

        selectCurso.addEventListener('change', cargarSecciones);
        selectSeccion.addEventListener('change', () => {
            modoBusqueda = false;
            offsetSemana = 0; // al cambiar de sección, siempre arrancamos en la semana actual
            cargarCumplimiento();
        });

        // --- Búsqueda por nombre, apellido o CI ---

        function ejecutarBusqueda() {
            const texto = inputBusqueda.value.trim();
            if (!texto) return;

            modoBusqueda = true;
            offsetSemana = 0; // toda búsqueda nueva arranca en la semana actual
            filtroContainer.style.display = 'none';
            btnLimpiarBusqueda.style.display = 'inline-block';

            buscarCumplimiento();
        }

        function limpiarBusqueda() {
            inputBusqueda.value = '';
            modoBusqueda = false;
            offsetSemana = 0;
            btnLimpiarBusqueda.style.display = 'none';
            filtroContainer.style.display = 'flex';
            ocultarTabla();
        }

        btnBuscar.addEventListener('click', ejecutarBusqueda);
        inputBusqueda.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') ejecutarBusqueda();
        });
        btnLimpiarBusqueda.addEventListener('click', limpiarBusqueda);
    </script>
</body>
</html>
