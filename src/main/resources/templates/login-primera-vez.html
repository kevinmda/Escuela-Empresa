<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión - Primera vez</title>

    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script th:src="@{/js/theme.js}" defer></script>

</head>
<body>
    <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-standalone">Modo oscuro</button>
    <h2>Iniciar sesión</h2>

    <p th:if="${param.error}" style="color: red;">
        Email o contraseña incorrectos.
    </p>
    <p th:if="${param.errorCorreo}" style="color: red;">
        No pudimos enviarte el correo. Intentá iniciar sesión de nuevo en unos minutos.
    </p>

    <p>Esta es tu primera vez ingresando. Después de poner tu contraseña, te vamos a mandar un código de activación por correo.</p>

    <form th:action="@{/login}" method="post">
        <div>
            <label>Email:</label>
            <input type="text" name="username" th:value="${email}" readonly>
        </div>
        <div>
            <label>Contraseña:</label>
            <input type="password" name="password" required autofocus>
        </div>
        <button type="submit">Ingresar</button>
    </form>

    <p><a th:href="@{/login(volver=true, email=${email})}">← Usar otro email</a></p>
</body>
</html>
