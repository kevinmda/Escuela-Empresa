<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Cromo único de las pantallas autenticadas: una sola barra.

    Uso:
      <th:block th:replace="~{fragments/chrome :: chrome(${chrome}, ${paginaActual}, true)}"></th:block>

    chrome trae identidad y rol, paginaActual es el contrato único para la sección
    activa, y conNavegacion permite reutilizar la barra en cambiar contraseña, que
    no tiene secciones.

    Antes eran dos barras apiladas: el header con el membrete y, debajo, el riel de
    secciones pegado con "top: 96px", un número atado al alto del logo. Juntas se
    comían ~140px fijos en todas las pantallas y leían como dos materiales distintos
    superpuestos. Ahora hay una sola capa: marca, riel y cuenta en la misma línea.

    data-esp viaja acá arriba para que el color de la especialidad del alumno tiña
    el chip de la sección activa y el disco de la cuenta. Administración y
    coordinación trabajan sobre varias especialidades: ahí el atributo queda vacío
    y el bloque base de [data-esp] devuelve el par --ink / --text-on-ink, que es un
    estado propio y no un color que faltó.
-->
<th:block th:fragment="chrome(chrome, paginaActual, conNavegacion)">
    <header class="barra"
            th:attr="data-esp=${chrome != null and chrome.especialidadId() != null ? chrome.especialidadId() : ''}">

        <!-- El nombre del colegio deja de ser un <h1>: en once pantallas competía
             con el h1 real de cada página y ninguna de las once trata "del colegio".
             Baja a marca, y gana la segunda línea que dice en qué sistema estás. -->
        <a class="barra-marca" th:href="@{/home}">
            <img class="barra-marca-logo" th:src="@{/img/ctnLogoDef.png}" alt="">
            <span class="barra-marca-nombre">
                <span class="barra-marca-largo">Colegio Técnico Nacional</span>
                <span class="barra-marca-corto">CTN</span>
            </span>
        </a>

        <nav class="barra-riel" th:if="${conNavegacion and chrome != null}" aria-label="Secciones">
            <a th:each="seccion : ${chrome.secciones()}"
               th:href="@{${seccion.destino()}}"
               class="nav-links"
               th:classappend="${paginaActual == seccion.clave()} ? ' activo'"
               th:attr="aria-current=${paginaActual == seccion.clave()} ? 'page' : null"
               th:text="${seccion.etiqueta()}">Sección</a>
        </nav>

        <div class="barra-cuenta">
            <!-- Se queda fuera del menú a propósito: es una preferencia que se
                 cambia seguido, y esconderla costaría un clic cada vez. -->
            <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-icono"
                    aria-label="Cambiar tema">
                <svg class="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>

            <!-- <details> y no un menú de JavaScript: cerrar sesión y cambiar la
                 contraseña tienen que seguir estando al alcance con el JS caído,
                 igual que el resto de la aplicación. El cierre con Escape o
                 clic afuera es una mejora encima, no el mecanismo. -->
            <details class="cuenta">
                <summary class="cuenta-boton">
                    <span class="cuenta-inicial" aria-hidden="true"
                          th:text="${chrome != null ? chrome.iniciales() : '?'}">FS</span>
                    <span class="cuenta-nombre"
                          th:text="${chrome != null ? chrome.nombre() : 'Cuenta'}">Nombre Apellido</span>
                    <svg class="cuenta-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m6 9 6 6 6-6"/>
                    </svg>
                    <span class="oculto-visual">Tu cuenta</span>
                </summary>

                <div class="cuenta-menu">
                    <div class="cuenta-ficha">
                        <p class="cuenta-ficha-nombre"
                           th:text="${chrome != null ? chrome.nombre() : 'Cuenta'}">Nombre Apellido</p>
                        <p class="cuenta-ficha-email"
                           th:text="${chrome != null ? chrome.email() : ''}">alguien@ctn.edu.py</p>
                        <p class="cuenta-ficha-rol">
                            <span th:text="${chrome != null ? chrome.rolEtiqueta() : 'Cuenta'}">Alumno</span>
                            <span th:if="${chrome != null and chrome.especialidadNombre() != null}"
                                  th:text="'· ' + ${chrome.especialidadNombre()}">· Electricidad</span>
                        </p>
                    </div>

                    <a class="cuenta-item" th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
                    <a class="cuenta-item"
                       th:if="${chrome != null and chrome.pdfAyuda() != null}"
                       th:href="@{${chrome.pdfAyuda()}}" target="_blank" rel="noopener">
                        Ayuda <span class="cuenta-item-nota">PDF</span>
                    </a>

                    <form class="cuenta-salida" th:action="@{/logout}" method="post"
                          onsubmit="return confirm('¿Estás seguro que quieres cerrar sesión?');">
                        <button type="submit" class="cuenta-item cuenta-item-salir">Cerrar sesión</button>
                    </form>
                </div>
            </details>
        </div>
    </header>
</th:block>

</body>
</html>
