<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Cromo único de las pantallas autenticadas: una sola barra.

    Uso:
      <th:block th:replace="~{fragments/chrome :: chrome(${chrome}, ${paginaActual}, true)}"></th:block>

    chrome trae identidad y rol, paginaActual es el contrato único para la sección
    activa, y conNavegacion permite reutilizar la barra en cambiar contraseña, que
    no tiene secciones.

    Antes eran dos barras apiladas: el header con el membrete y, debajo, el riel de
    secciones pegado con "top: 96px", un número atado al alto del logo. Juntas se
    comían ~140px fijos en todas las pantallas y leían como dos materiales distintos
    superpuestos. Ahora hay una sola capa: marca, riel y cuenta en la misma línea.

    data-esp viaja acá arriba para que el color de la especialidad del alumno tiña
    el chip de la sección activa y el disco de la cuenta. Administración y
    coordinación trabajan sobre varias especialidades: ahí el atributo queda vacío
    y el bloque base de [data-esp] devuelve el par --ink / --text-on-ink, que es un
    estado propio y no un color que faltó.
-->
<th:block th:fragment="chrome(chrome, paginaActual, conNavegacion)">
    <header class="barra"
            th:attr="data-esp=${chrome != null and chrome.especialidadId() != null ? chrome.especialidadId() : ''}">

        <!-- El nombre del colegio deja de ser un <h1>: en once pantallas competía
             con el h1 real de cada página y ninguna de las once trata "del colegio".
             Baja a marca, y gana la segunda línea que dice en qué sistema estás. -->
        <a class="barra-marca" th:href="@{/home}">
            <img class="barra-marca-logo" th:src="@{/img/ctnLogoDef.png}" alt="">
            <span class="barra-marca-nombre">
                <span class="barra-marca-largo">Colegio Técnico Nacional</span>
                <span class="barra-marca-corto">CTN</span>
            </span>
        </a>

        <nav class="barra-riel" th:if="${conNavegacion and chrome != null}" aria-label="Secciones">
            <th:block th:each="seccion : ${chrome.secciones()}">
                <a th:unless="${seccion.tieneSubsecciones()}"
                   th:href="@{${seccion.destino()}}"
                   class="nav-links"
                   th:classappend="${paginaActual == seccion.clave()} ? ' activo'"
                   th:attr="aria-current=${paginaActual == seccion.clave()} ? 'page' : null"
                   th:text="${seccion.etiqueta()}">Sección</a>

                <!-- Mismo <details> que el menú de cuenta (misma clase .cuenta), así
                     el desplegable sale con el CSS que ya existe, sin agregar nada. -->
                <details th:if="${seccion.tieneSubsecciones()}" class="cuenta">
                    <summary class="nav-links cuenta-boton"
                             th:classappend="${seccion.activa(paginaActual)} ? ' activo'">
                        <span th:text="${seccion.etiqueta()}">Documentos</span>
                        <svg class="cuenta-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m6 9 6 6 6-6"/>
                        </svg>
                    </summary>
                    <div class="cuenta-menu">
                        <a th:each="sub : ${seccion.subsecciones()}"
                           th:href="@{${sub.destino()}}"
                           class="cuenta-item"
                           th:classappend="${paginaActual == sub.clave()} ? ' activo'"
                           th:attr="aria-current=${paginaActual == sub.clave()} ? 'page' : null"
                           th:text="${sub.etiqueta()}">Sub</a>
                    </div>
                </details>
            </th:block>
        </nav>

        <div class="barra-cuenta">
            <!-- Se queda fuera del menú a propósito: es una preferencia que se
                 cambia seguido, y esconderla costaría un clic cada vez. -->
            <button type="button" id="theme-toggle" class="theme-toggle theme-toggle-icono"
                    aria-label="Cambiar tema">
                <svg class="ico-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
                <svg class="ico-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
            </button>

            <!-- Misma caja que "Documentos" en el riel (mismo <details class="cuenta">),
                 pero acá el contenido es la lista de avisos en vez de un menú de
                 navegación. Directo al lado del toggle de tema porque, a diferencia de
                 cerrar sesión o cambiar la contraseña, esto conviene verlo de entrada:
                 aunque esté colapsada, la caja ya muestra si hay algo con el punto de
                 color. Si mañana hay más de un aviso a la vez, avisosOrdenados() ya
                 los entrega del más reciente al más viejo. -->
            <details th:if="${chrome != null and !chrome.avisos().isEmpty()}" class="cuenta">
                <summary class="nav-links cuenta-boton aviso-caja"
                         th:classappend="${chrome.colorCampana() != 'gris'} ? ('aviso-caja--' + ${chrome.colorCampana()}) : ''"
                         aria-label="Avisos">
                    <svg class="aviso-caja-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6 8a6 6 0 0 1 12 0c0 4.5 1.5 6.5 2.3 7.6.3.4 0 1-.5 1H4.2c-.5 0-.8-.6-.5-1C4.5 14.5 6 12.5 6 8z"/>
                        <path d="M10.2 21a1.94 1.94 0 0 0 3.6 0"/>
                    </svg>
                    <span th:if="${chrome.hayAvisosSinLeer()}" class="aviso-caja-punto" aria-hidden="true"></span>
                </summary>
                <div class="cuenta-menu aviso-menu">
                    <th:block th:each="aviso, iterAviso : ${chrome.avisosOrdenados()}">
                        <!-- Encabezado de grupo: solo antes del primer aviso de cada día
                             distinto. Como avisosOrdenados() ya viene del más reciente al más
                             viejo, alcanza con comparar contra el anterior de la misma lista
                             (o no comparar nada si es el primero de todos). -->
                        <p class="aviso-grupo-titulo"
                           th:if="${iterAviso.index == 0 or aviso.etiquetaDia() != chrome.avisosOrdenados().get(iterAviso.index - 1).etiquetaDia()}"
                           th:text="${aviso.etiquetaDia()}">Hoy</p>
                        <!-- div y no <a> alrededor de todo: un <button> no puede ir anidado
                             dentro de un <a> (contenido interactivo dentro de contenido
                             interactivo, invalido en HTML), así que el link y el botón de
                             marcar como leído van como hermanos, no uno adentro del otro. -->
                        <div class="cuenta-item aviso-item"
                             th:classappend="${aviso.tipo() == 'listo'} ? ' aviso-item--listo' : ' aviso-item--pendiente'">
                            <a th:href="@{${aviso.destino()}}" class="aviso-item-link"
                               th:text="${aviso.texto()}">Aviso</a>
                            <!-- No desaparece al leerlo: queda deshabilitado y apagado (mismo
                                 tilde, sin poder tocarlo de nuevo), así se ve que esa fila ya se
                                 leyó sin que la fila entera pierda su botón. -->
                            <button type="button" class="aviso-item-marcar"
                                    th:attr="data-codigo=${aviso.codigo()},data-clave=${aviso.clave()}"
                                    th:disabled="${aviso.leido()}"
                                    aria-label="Marcar como leído" onclick="marcarAvisoLeido(this)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M20 6 9 17l-5-5"/>
                                </svg>
                            </button>
                        </div>
                    </th:block>
                </div>
            </details>

            <!-- <details> y no un menú de JavaScript: cerrar sesión y cambiar la
                 contraseña tienen que seguir estando al alcance con el JS caído,
                 igual que el resto de la aplicación. El cierre con Escape o
                 clic afuera es una mejora encima, no el mecanismo. -->
            <details class="cuenta">
                <summary class="cuenta-boton">
                    <span class="cuenta-inicial" aria-hidden="true"
                          th:text="${chrome != null ? chrome.iniciales() : '?'}">FS</span>
                    <span class="cuenta-nombre"
                          th:text="${chrome != null ? chrome.nombre() : 'Cuenta'}">Nombre Apellido</span>
                    <svg class="cuenta-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="m6 9 6 6 6-6"/>
                    </svg>
                    <span class="oculto-visual">Tu cuenta</span>
                </summary>

                <div class="cuenta-menu">
                    <div class="cuenta-ficha">
                        <p class="cuenta-ficha-nombre"
                           th:text="${chrome != null ? chrome.nombre() : 'Cuenta'}">Nombre Apellido</p>
                        <p class="cuenta-ficha-email"
                           th:text="${chrome != null ? chrome.email() : ''}">alguien@ctn.edu.py</p>
                        <p class="cuenta-ficha-rol">
                            <span th:text="${chrome != null ? chrome.rolEtiqueta() : 'Cuenta'}">Alumno</span>
                            <span th:if="${chrome != null and chrome.especialidadNombre() != null}"
                                  th:text="'· ' + ${chrome.especialidadNombre()}">· Electricidad</span>
                        </p>
                    </div>

                    <a class="cuenta-item" th:href="@{/cambiar-contrasena}">Cambiar contraseña</a>
                    <a class="cuenta-item"
                       th:if="${chrome != null and chrome.pdfAyuda() != null}"
                       th:href="@{${chrome.pdfAyuda()}}" target="_blank" rel="noopener">
                        Ayuda <span class="cuenta-item-nota">PDF</span>
                    </a>
                    <!-- Descarga directa y no target="_blank": es un binario, no
                         algo para abrir en una pestaña. download sugiere el
                         nombre de archivo aunque el navegador muestre otra cosa
                         en la URL. Solo para alumno (ver apkDescarga en
                         ChromeContext): es la única app que existe hoy, y
                         mostrarla en coordinación/administración prometería una
                         pantalla que esos roles no tienen. -->
                    <a class="cuenta-item"
                       th:if="${chrome != null and chrome.apkDescarga() != null}"
                       th:href="@{${chrome.apkDescarga()}}" download="GestorPasantes.apk">
                        Descargar app <span class="cuenta-item-nota">APK</span>
                    </a>
                    <!-- Acá y no en un pie de página: agregarle un pie a las once
                         pantallas costaría altura en todas para dos enlaces que se
                         consultan una vez. En el menú de la cuenta están donde uno
                         los busca -junto a lo que tiene que ver con uno mismo- y no
                         le quitan sitio a nada. -->
                    <a class="cuenta-item" th:href="@{/privacidad}">
                        Privacidad <span class="cuenta-item-nota">y uso</span>
                    </a>

                    <form class="cuenta-salida" th:action="@{/logout}" method="post"
                          data-confirmar
                          data-confirmar-titulo="¿Cerrar sesión?"
                          data-confirmar-mensaje="Vas a tener que volver a iniciar sesión la próxima vez."
                          data-confirmar-texto="Cerrar sesión"
                          data-confirmar-variante="neutral">
                        <button type="submit" class="cuenta-item cuenta-item-salir">Cerrar sesión</button>
                    </form>
                </div>
            </details>
        </div>
    </header>

    <!-- Crédito de autoría, igual al de fragments/auth :: pieLegal (pantallas de
         acceso). Vive acá porque este es el único fragmento que comparten las
         trece pantallas del panel interno: un cambio de nombre o de enlace se
         hace en este único lugar y llega a todas sin tocarlas una por una.
         No se borra, no se mueve a un menú oculto, no se reemplaza por otro
         texto. -->
    <footer class="credito-disenio" aria-label="Créditos de diseño y desarrollo">
        <span>Desarrollado por:</span>
        <span>Facundo Vera</span>
        <span>y por:</span>
        <span>Kevin Duré</span>
    </footer>

    <!-- Reemplaza confirm() nativo del navegador en toda la app. Un único
         <dialog> global: cualquier <form> con data-confirmar lo usa (ver
         inicializarConfirmaciones en theme.js), así que agregar una
         confirmación nueva en cualquier pantalla es poner los atributos
         data-*, no copiar este bloque. data-confirmar-variante decide el
         color del ícono y del botón: "peligro" (por defecto) para lo que
         borra algo, "neutral" para lo que no pierde datos (cerrar sesión). -->
    <dialog id="dialogo-confirmacion" class="dialogo-confirmacion"
            aria-labelledby="dialogo-confirmacion-titulo" aria-describedby="dialogo-confirmacion-mensaje">
        <div class="dialogo-confirmacion-icono" aria-hidden="true">
            <svg class="dc-icono-peligro" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 7h16"/>
                <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
                <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>
                <path d="M10 11v6M14 11v6"/>
            </svg>
            <svg class="dc-icono-neutral" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <path d="M16 17l5-5-5-5"/>
                <path d="M21 12H9"/>
            </svg>
        </div>

        <h2 class="dialogo-confirmacion-titulo" id="dialogo-confirmacion-titulo"></h2>
        <p class="dialogo-confirmacion-mensaje" id="dialogo-confirmacion-mensaje"></p>

        <div class="dialogo-confirmacion-acciones">
            <button type="button" class="btn-secondary" id="dialogo-confirmacion-cancelar">Cancelar</button>
            <button type="button" id="dialogo-confirmacion-confirmar"></button>
        </div>
    </dialog>
</th:block>

</body>
</html>
