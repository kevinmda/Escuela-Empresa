<!DOCTYPE html>
<!--
    Fragmentos compartidos por las 7 pantallas del flujo de acceso.

    Antes cada plantilla repetía su propio <head> y su propio <header>, así que la
    consistencia entre ellas dependía de copiar y pegar bien: bastaba tocar una sola
    para que se desalineara del resto. Acá viven una única vez.

    Uso desde una plantilla:
        <html lang="es" xmlns:th="http://www.thymeleaf.org">
        <head th:replace="~{fragments/auth :: head('Iniciar sesión')}"></head>
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">

    <!-- Fija data-theme antes de que el navegador pinte nada: theme.js carga con
         defer y corre recien despues del primer render, asi que sin esto la
         pagina arranca en claro (el :root por defecto) y salta a oscuro apenas
         theme.js llega -- ese salto es el parpadeo al cambiar de pagina. -->
    <script>
        (function () {
            var tema = localStorage.getItem('theme')
                || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = tema;
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Acceso</title>
    <meta name="description" content="Sistema de gestión de pasantías del Colegio Técnico Nacional de Asunción.">
    <link rel="icon" type="image/png" th:href="@{/img/ctnLogoDef.png}">

    <!-- Vista previa al compartir el link (WhatsApp, Slack, etc). og:image necesita
         URL absoluta: las redes no resuelven "/img/..." relativo a nada. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CTN Pasantías">
    <meta property="og:title" th:content="${titulo}">
    <meta property="og:description" content="Sistema de gestión de pasantías del Colegio Técnico Nacional de Asunción.">
    <meta property="og:image" th:content="${(baseUrl ?: '')} + '/img/ctnLogoDef.png'">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" th:content="${titulo}">
    <meta name="twitter:description" content="Sistema de gestión de pasantías del Colegio Técnico Nacional de Asunción.">
    <meta name="twitter:image" th:content="${(baseUrl ?: '')} + '/img/ctnLogoDef.png'">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <!-- La ilustración es el elemento LCP en escritorio, pero se aplica como
         background en CSS y los backgrounds no reciben prioridad de carga: el
         preload se la devuelve.
         El media es imprescindible, no un detalle: sin él el preload descarga la
         imagen SIEMPRE, incluso en móvil, donde no se muestra. El breakpoint
         acompaña al de .auth-split en styles.css. -->
    <link rel="preload" as="image" media="(min-width: 900px)"
          th:href="@{/img/auth-ilustracion.webp}">

    <script th:src="@{/js/theme.js}" defer></script>
    <script th:src="@{/js/cookie-consent.js}" defer></script>
</head>

<body>

<!-- Logo del colegio, centrado arriba de la tarjeta (como en la referencia).
     La ilustración de fondo la pone .auth-split en CSS; no hay panel de marca. -->
<img th:fragment="logoTarjeta" class="auth-card-logo" th:src="@{/img/ctnLogoDef.png}"
     alt="Colegio Técnico Nacional de Asunción">

<!-- Pie con los enlaces legales. Va DEBAJO de la tarjeta y no adentro: son
     enlaces de consulta, no parte del formulario, y adentro competirían con el
     botón que la pantalla quiere que toques.
     Aparece en las pantallas de acceso porque es donde alguien puede querer leer
     qué se guarda sobre él antes de entrar; estando adentro, los mismos dos
     enlaces viven en el menú de cuenta de la barra. -->
<nav th:fragment="pieLegal" class="pie-legal" aria-label="Información legal">
    <a th:href="@{/privacidad}">Privacidad</a>
    <span class="pie-legal-sep" aria-hidden="true">·</span>
    <a th:href="@{/terminos}">Condiciones de uso</a>
</nav>

</body>
</html>
