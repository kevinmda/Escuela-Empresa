# Configuracion SOLO de los tests. Reemplaza entera a la de src/main/resources.
#
# El unico test que habia (contextLoads) levanta el contexto completo de Spring,
# y con ddl-auto=validate contra MySQL eso significaba que "mvnw test" no corria
# si no habia un MySQL andando con el esquema ya creado. Con una base en memoria
# que Hibernate arma desde las propias entidades, el test comprueba lo que tiene
# que comprobar -- que todos los beans se resuelven y la aplicacion arranca --
# sin depender de nada de afuera.
spring.datasource.url=jdbc:h2:mem:pruebas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

app.uploads.directorio=./target/uploads-de-prueba
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.url.base=http://localhost:8080

# JavaMailSender solo se autoconfigura si hay un host definido, y EmailService lo
# necesita para construirse. No se manda ni un correo: ningun test dispara un
# envio, y el host apunta a un lugar que no existe justamente para que se note si
# alguna vez alguno lo intentara.
spring.mail.host=localhost
spring.mail.port=2525
