services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: escuela-empresa
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/escuela-empresa
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY}
      JWT_SECRET: ${JWT_SECRET}
      COOKIES_SEGURAS: ${COOKIES_SEGURAS:-false}
      APP_SECURITY_FORZAR_HTTPS: ${APP_SECURITY_FORZAR_HTTPS:-false}
      APP_URL_BASE: ${APP_URL_BASE}
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

volumes:
  mysql-data:
  uploads-data:
